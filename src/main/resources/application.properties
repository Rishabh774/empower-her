# =============================================
# APPLICATION BASIC CONFIGURATION
# =============================================
spring.application.name=empowerher

# =============================================
# SERVER CONFIGURATION
# =============================================
server.port=8081
server.servlet.context-path=/
server.error.include-stacktrace=never
server.error.include-message=always
server.error.whitelabel.enabled=true

# =============================================
# DATABASE CONFIGURATION - MySQL
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3307/empowerher_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Database Connection Pool
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

# =============================================
# JPA/HIBERNATE CONFIGURATION
# =============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.charSet=UTF-8
spring.jpa.properties.hibernate.connection.characterEncoding=UTF-8
spring.jpa.properties.hibernate.connection.useUnicode=true
spring.jpa.open-in-view=true

# =============================================
# FILE UPLOAD CONFIGURATION (FIXED)
# =============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false

# File upload directory - FIXED PATH
file.upload-dir=uploads/

# =============================================
# STATIC RESOURCES CONFIGURATION (FIXED)
# =============================================
spring.web.resources.static-locations=classpath:/static/,classpath:/uploads/,file:./uploads/
spring.web.resources.add-mappings=true
spring.web.resources.cache.period=3600
spring.mvc.static-path-pattern=/**

# =============================================
# THYMELEAF TEMPLATE CONFIGURATION
# =============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true

# =============================================
# SECURITY CONFIGURATION
# =============================================
spring.security.filter.order=10

# =============================================
# LOGGING CONFIGURATION (Optimized)
# =============================================
logging.level.com.empowerher=DEBUG
logging.level.com.empowerher.controllers=INFO
logging.level.com.empowerher.services=INFO
logging.level.com.empowerher.repositories=INFO

# Framework logs - Reduced for better performance
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN
logging.level.org.springframework.core=WARN

# Database logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log file configuration
logging.file.name=logs/empowerher.log
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# =============================================
# DEVTOOLS (Development only)
# =============================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.exclude=static/**,uploads/**

# =============================================
# SPRING MVC CONFIGURATION
# =============================================
spring.mvc.throw-exception-if-no-handler-found=true
spring.mvc.format.date=iso

# =============================================
# ADDITIONAL SECURITY HEADERS
# =============================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# =============================================
# PROFILE SPECIFIC (Development Profile)
# =============================================
spring.profiles.active=dev




# =============================================
# EMAIL CONFIGURATION
# =============================================

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=empowerher167@gmail.com
spring.mail.password=kalo xeuj eddr tlpc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Temporary fix for circular dependency
spring.main.allow-circular-references=true


# Email Settings
app.email.from=empowerher.noreply@gmail.com
app.email.admin=admin@empowerher.com
app.email.support=support@empowerher.com

# Email Templates
app.email.templates.welcome=emails/welcome-email
app.email.templates.new-scheme=emails/new-scheme-notification