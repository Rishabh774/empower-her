<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EmpowerHer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #E75480;
            --secondary-color: #6A1E55;
            --accent-color: #F5B841;
            --light-bg: #FFF4F6;
            --dark-text: #2B2B2B;
        }

        .register-container {
            min-height: 100vh;
            background: var(--light-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        
        .register-container::before {
            content: '';
            position: absolute;
            width: 300%;
            height: 300%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><polygon fill="rgba(231,84,128,0.1)" points="500,1000 1000,500 500,0 0,500"/></svg>');
            animation: rotate 30s infinite linear;
        }
        
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .register-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            border: 1px solid rgba(231, 84, 128, 0.2);
            box-shadow: 0 25px 50px rgba(0,0,0,0.2);
            overflow: hidden;
            max-width: 500px;
            width: 100%;
            z-index: 2;
            border-left: 6px solid var(--primary-color);
        }
        
        .register-header {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 40px 30px;
            text-align: center;
            position: relative;
        }
        
        .register-header::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            background: white;
            rotate: 45deg;
        }
        
        .register-body {
            padding: 50px 40px 40px;
        }
        
        .form-control-modern {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px 20px;
            transition: all 0.3s ease;
            font-size: 1rem;
        }
        
        .form-control-modern:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(231, 84, 128, 0.1);
            transform: translateY(-2px);
        }
        
        .btn-register {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border: none;
            border-radius: 25px;
            padding: 15px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            color: white;
        }
        
        .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(231, 84, 128, 0.3);
            color: white;
        }
        
        .security-badge {
            background: var(--light-bg);
            border-radius: 15px;
            border: 2px solid var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <!-- Header -->
            <div class="register-header">
                <div class="floating mb-3">
                    <img src="/images/logo.png" alt="EmpowerHer Logo" height="60">
                </div>
                <h2 class="fw-bold mb-2">Join EmpowerHer</h2>
                <p class="mb-0 opacity-75">Create your account and start exploring opportunities</p>
            </div>

            <!-- Body -->
            <div class="register-body">
                <!-- Error Messages -->
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show rounded-3">
                    <i class="fas fa-exclamation-triangle me-2"></i>
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Registration Form -->
                <form th:action="@{/register}" method="post" th:object="${user}" id="registerForm">
                    <div class="mb-4">
                        <label for="username" class="form-label fw-semibold">
                            <i class="fas fa-user me-2" style="color: var(--primary-color);"></i>Username
                        </label>
                        <input type="text" class="form-control-modern" 
                               id="username" th:field="*{username}"
                               placeholder="Choose a username" required>
                        <div th:if="${#fields.hasErrors('username')}" class="text-danger small mt-2">
                            <i class="fas fa-exclamation-circle me-1"></i>
                            <span th:errors="*{username}"></span>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="email" class="form-label fw-semibold">
                            <i class="fas fa-envelope me-2" style="color: var(--primary-color);"></i>Email
                        </label>
                        <input type="email" class="form-control-modern" 
                               id="email" th:field="*{email}"
                               placeholder="Enter your email" required>
                        <div th:if="${#fields.hasErrors('email')}" class="text-danger small mt-2">
                            <i class="fas fa-exclamation-circle me-1"></i>
                            <span th:errors="*{email}"></span>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="fas fa-lock me-2" style="color: var(--primary-color);"></i>Password
                        </label>
                        <input type="password" class="form-control-modern" 
                               id="password" th:field="*{password}"
                               placeholder="Create a strong password" required>
                        <div th:if="${#fields.hasErrors('password')}" class="text-danger small mt-2">
                            <i class="fas fa-exclamation-circle me-1"></i>
                            <span th:errors="*{password}"></span>
                        </div>
                    </div>
                    
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-register">
                            <i class="fas fa-user-plus me-2"></i> Create Account
                        </button>
                    </div>
                </form>
                
                <div class="text-center mb-4">
                    <p class="text-muted">Already have an account? 
                        <a th:href="@{/login}" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Login here</a>
                    </p>
                </div>

                <!-- Security Info -->
                <div class="security-badge p-4 text-center">
                    <i class="fas fa-shield-alt fa-2x mb-3" style="color: var(--primary-color);"></i>
                    <h6 class="fw-bold mb-2">Secure Registration</h6>
                    <p class="small text-muted mb-0">
                        Your information is protected and will only be used to provide personalized scheme recommendations.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const submitBtn = this.querySelector('button[type="submit"]');
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Creating Account...';
            submitBtn.disabled = true;
        });

        // Add input animations
        document.querySelectorAll('.form-control-modern').forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.classList.add('focused');
            });
            
            input.addEventListener('blur', function() {
                if (!this.value) {
                    this.parentElement.classList.remove('focused');
                }
            });
        });
    </script>
</body>
</html>
